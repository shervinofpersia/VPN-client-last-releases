name: Update VPN Clients JSON

on:
  schedule:
    - cron: '0 * * * *'        # هر ساعت یک‌بار
  workflow_dispatch:            # اجرای دستی (این مهمه برای تست)

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0       # برای اطمینان از اینکه همه تاریخچه رو داریم

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector script
        env:
          GITHUB_TOKEN: ${{ secrets.VPN_GITHUB_TOKEN }}
        run: python generate_vpn_list.py

      # این مرحله فقط برای دیباگه؛ بعداً می‌تونی حذفش کنی
      - name: Debug - Show generated file
        run: |
          echo "=== فایل‌های موجود در مخزن ==="
          ls -la
          echo "=== محتوای فایل JSON (اگه وجود داشته باشه) ==="
          if [ -f vpn_clients_data.json ]; then
            head -c 500 vpn_clients_data.json
          else
            echo "⚠️ فایل vpn_clients_data.json پیدا نشد!"
          fi

      - name: Commit and push if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # چک کردن اینکه آیا فایل وجود داره یا نه
          if [ ! -f vpn_clients_data.json ]; then
            echo "❌ فایل JSON وجود ندارد، عملیات متوقف شد."
            exit 1
          fi

          # اضافه کردن فایل به stage
          git add vpn_clients_data.json

          # اگر تغییری نداشته باشه، commit خطا میده؛ پس چک می‌کنیم
          if git diff --staged --quiet; then
            echo "هیچ تغییری در فایل JSON دیده نشد."
          else
            git commit -m "🔄 بروزرسانی خودکار لیست کلاینت‌های VPN - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
