name: Update VPN Clients JSON

on:
  schedule:
    - cron: '0 * * * *'         # هر ساعت یک بار
  workflow_dispatch:             # اجرای دستی

permissions:
  contents: write                # اجازه push کردن فایل JSON

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector script
        env:
          GITHUB_TOKEN: ${{ secrets.VPN_GITHUB_TOKEN }}   # توکن شخصی شما (اختیاری)
        run: python generate_vpn_list.py

      - name: Commit and push if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet vpn_clients_data.json; then
            echo "No changes in JSON file."
          else
            git add vpn_clients_data.json
            git commit -m "🔄 Automatic update - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
